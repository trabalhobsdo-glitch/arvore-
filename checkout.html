<body><svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></symbol><symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol><symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol><symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol><symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol><symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol><symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></symbol><symbol id="i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol><symbol id="i-award" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></symbol><symbol id="i-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></symbol><symbol id="i-utensils" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol><symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol><symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol><symbol id="i-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></symbol><symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol><symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol><symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol><symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol><symbol id="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol></svg>
<header><a class="hl" href="index.html" aria-label="Cervinia Natal - início">CERVINIA <span>✦ NATAL</span></a><span class="sec"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg> Checkout seguro</span><a class="back" href="index.html"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg> Voltar</a></header>
<div class="wrap">
<form id="form" novalidate>
  <div class="card">
    <h2>1. Seus dados</h2>
    <div class="row"><div><label for="nome">Nome completo</label><input id="nome" autocomplete="name" required><div class="msg"></div></div></div>
    <div class="row r2">
      <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><div class="msg"></div></div>
      <div><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required><div class="msg"></div></div>
    </div>
    <div class="row"><div><label for="tel">Celular / WhatsApp</label><input id="tel" type="tel" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel" required><div class="msg"></div></div></div>
  </div>
  <div class="card">
    <h2>2. Entrega</h2>
    <div class="row r2"><div><label for="cep">CEP</label><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code" required><div class="msg"></div></div><div></div></div>
    <div class="row"><div><label for="rua">Endereço</label><input id="rua" autocomplete="address-line1" required><div class="msg"></div></div></div>
    <div class="row r3">
      <div><label for="bairro">Bairro</label><input id="bairro" required><div class="msg"></div></div>
      <div><label for="numero">Número</label><input id="numero" required><div class="msg"></div></div>
      <div><label for="comp">Complemento</label><input id="comp"></div>
    </div>
    <div class="row r2">
      <div><label for="cidade">Cidade</label><input id="cidade" required><div class="msg"></div></div>
      <div><label for="uf">UF</label><input id="uf" maxlength="2" required><div class="msg"></div></div>
    </div>
  </div>
  <div class="card payment-card">
    <h2>3. Forma de pagamento</h2>
    <div class="payment-options">
      <label class="payment-option"><input type="radio" name="paymentMethod" value="pix" checked> <span><strong>Pix</strong><small>QR Code e código copia e cola</small></span></label>
      <label class="payment-option"><input type="radio" name="paymentMethod" value="credit_card"> <span><strong>Cartão de crédito</strong><small>Parcelamento em até 12x, conforme aprovação</small></span></label>
    </div>
    <div id="card-fields" hidden>
      <div class="row"><div><label for="card-holder">Nome impresso no cartão</label><input id="card-holder" autocomplete="cc-name" maxlength="80"><div class="msg"></div></div></div>
      <div class="row"><div><label for="card-number">Número do cartão</label><input id="card-number" inputmode="numeric" autocomplete="cc-number" maxlength="23" placeholder="0000 0000 0000 0000"><div class="msg"></div></div></div>
      <div class="row r3">
        <div><label for="card-month">Mês</label><input id="card-month" inputmode="numeric" autocomplete="cc-exp-month" maxlength="2" placeholder="MM"><div class="msg"></div></div>
        <div><label for="card-year">Ano</label><input id="card-year" inputmode="numeric" autocomplete="cc-exp-year" maxlength="4" placeholder="AAAA"><div class="msg"></div></div>
        <div><label for="card-cvv">CVV</label><input id="card-cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="123"><div class="msg"></div></div>
      </div>
      <div class="row"><div><label for="installments">Parcelas</label><select id="installments"><option value="1">1x sem juros</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="5">5x</option><option value="6">6x</option><option value="7">7x</option><option value="8">8x</option><option value="9">9x</option><option value="10">10x</option><option value="11">11x</option><option value="12">12x</option></select></div></div>
      <p class="payment-note">Os dados do cartão são tokenizados pela biblioteca da Pagou.AI antes de serem enviados ao servidor da loja.</p>
    </div>
  </div>
  <button type="submit" id="btn">Gerar Pix</button>
  <div class="aviso" id="aviso" role="alert"></div>
  <div class="payment-result card" id="payment-result" hidden aria-live="polite"></div>
  <div class="pay center" aria-label="Formas de pagamento"><img src="assets/pay/visa.svg" alt="Visa" width="40" height="26"><img src="assets/pay/mastercard.svg" alt="Mastercard" width="40" height="26"><img src="assets/pay/elo.svg" alt="Elo" width="40" height="26"><img src="assets/pay/pix.svg" alt="Pix" width="40" height="26"></div>
  <p class="seguro"><span class="sec"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg> Compra segura</span> · Seus dados são protegidos</p>
</form>

<aside class="resumo">
  <div class="card">
    <h2>Resumo do pedido</h2>
    <div class="prod"><img src="assets/hero.webp" alt="" width="64" height="64"><div><b id="r-nome"></b><small id="r-brinde"></small></div><span id="r-preco"></span></div>
    <div class="de">De <s id="r-de"></s> <span class="off" id="r-off"></span></div>
    <div class="linha"><span>Frete</span><span id="r-frete">Informe o CEP</span></div>
    <div class="linha"><span>Prazo</span><span id="r-prazo"></span></div>
    <div class="linha total"><span>Total</span><span id="r-total"></span></div>
    <div class="seguro" id="r-parc"></div><div class="pay center" aria-label="Formas de pagamento"><img src="assets/pay/visa.svg" alt="Visa" width="40" height="26"><img src="assets/pay/mastercard.svg" alt="Mastercard" width="40" height="26"><img src="assets/pay/elo.svg" alt="Elo" width="40" height="26"><img src="assets/pay/pix.svg" alt="Pix" width="40" height="26"></div>
  </div>
</aside>
</div>
<div class="wrap"><div class="card ok" id="ok" style="grid-column:1/-1"></div></div>
<script src="config.js"></script>
<script src="checkout.js"></script>
</body>
</html>
